            targetUrl:
              type: string
              minLength: 8
              maxLength: 1000
            hookActionId:
              type: integer
            isBlocking:
              type: boolean
            isVisible:
              type: boolean
              default: true
            isOnceDaily:
              type: boolean
              default: false
            dailyResetTime:
              type: string
              default: null
              pattern: ^([01]?\d|2[0-3]):\d{2}$
              x-nullable: true
            dailyResetTimezone:
              type: string
              default: null
