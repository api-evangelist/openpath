      - application/json
      produces:
      - application/json
      tags:
      - orgs/subscriptions
      security:
      - jwt: []
      responses:
        '200':
          schema:
            type: object
            properties:
              totalCount:
                type: integer
              filteredCount:
                type: integer
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                    subjectOrg:
                      type: object
                      properties:
                        id:
                          type: integer
                      required:
                      - id
                    hookEvent:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                        updatedAt:
                          type: string
                          format: date
                      required:
                      - id
                    hookAction:
                      x-nullable: true
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                          x-nullable: true
                        config:
                          type: object
                        updatedAt:
                          type: string
                          format: date
                      required:
                      - id
                    targetUrl:
                      type: string
                      x-nullable: true
                    isActive:
                      type: boolean
                    isBlocking:
                      type: boolean
                    isVisible:
                      type: boolean
                    name:
                      type: string
                    description:
                      type: string
                      x-nullable: true
                    rateLimitCount:
                      type: integer
                      x-nullable: true
                    rateLimitWindowSecs:
                      type: integer
                      x-nullable: true
                    isOnceDaily:
                      type: boolean
                    dailyResetTime:
                      type: string
                      x-nullable: true
                    dailyResetTimezone:
                      type: string
                      x-nullable: true
                    handlerHookEventLocation:
                      type: object
                      properties:
                        id:
                          type: integer
                          minimum: 1
                      required:
                      - id
                    updatedAt:
                      type: string
                      format: date
                  required:
                  - id
              meta:
                type: object
                properties:
                  accessToken:
                    x-nullable: true
                    type: object
                    properties:
                      scopeUpdatedAt:
                        type: string
                        format: date
                  siteSpecificAccess:
                    x-nullable: true
                    type: object
                    properties:
                      isSiteSpecific:
                        type: boolean
                      siteIds:
                        x-nullable: true
                        type: array
                        items:
                          type: integer
                      siteIdsByScope:
                        type: object
                        properties:
                          string:
                            x-nullable: true
                            type: array
                            items:
