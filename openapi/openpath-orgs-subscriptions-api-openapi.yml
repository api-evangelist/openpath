        __Endpoint name__: createSubscription'
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: integer
      tags:
      - orgs/subscriptions
      security:
      - jwt: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: number
                      subjectOrg:
                        type: object
                        properties:
                          id:
                            type: integer
                        required:
                        - id
                      hookEvent:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          description:
                            type: string
                          updatedAt:
                            type: string
                            format: date
                        required:
                        - id
                      hookAction:
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          description:
                            type:
                            - string
                            - 'null'
                          config:
                            type: object
                          updatedAt:
                            type: string
                            format: date
                        required:
                        - id
                      targetUrl:
                        type:
                        - string
                        - 'null'
                      isActive:
                        type: boolean
                      isBlocking:
                        type: boolean
                      isVisible:
                        type: boolean
                      name:
                        type: string
                      description:
                        type:
                        - string
                        - 'null'
                      rateLimitCount:
                        type:
                        - integer
                        - 'null'
                      rateLimitWindowSecs:
                        type:
                        - integer
                        - 'null'
                      isOnceDaily:
                        type: boolean
                      dailyResetTime:
                        type:
                        - string
                        - 'null'
                      dailyResetTimezone:
                        type:
                        - string
                        - 'null'
                      handlerHookEventLocation:
                        type: object
                        properties:
                          id:
                            type: integer
                            minimum: 1
                        required:
                        - id
                      updatedAt:
                        type: string
                        format: date
                    required:
                    - id
                  meta:
                    type: object
                    properties:
                      accessToken:
                        type:
                        - object
                        - 'null'
                        properties:
                          scopeUpdatedAt:
                            type: string
                            format: date
                      siteSpecificAccess:
                        type:
                        - object
                        - 'null'
                        properties:
                          isSiteSpecific:
                            type: boolean
                          siteIds:
                            type:
                            - array
                            - 'null'
                            items:
                              type: integer
                          siteIdsByScope:
                            type:
                            - object
                            - 'null'
                            properties:
                              string:
                                type:
                                - array
                                - 'null'
                                items:
                                  type: integer
      x-op-scopes:
      - o{params.orgId}-configurations:w
      - o{params.orgId}-outboundWebhooks:w
      - o:w
      - s-o:w
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hookEventId:
                  type: integer
                hookEventName:
                  type: string
                  minLength: 1
                  maxLength: 100
                targetUrl:
                  type: string
                  minLength: 8
                  maxLength: 1000
                hookActionId:
                  type: integer
                isBlocking:
                  type: boolean
                isVisible:
                  type: boolean
                  default: true
                isOnceDaily:
                  type: boolean
                  default: false
                dailyResetTime:
                  type:
                  - string
                  - 'null'
                  default: null
                  pattern: ^([01]?\d|2[0-3]):\d{2}$
                dailyResetTimezone:
                  type:
                  - string
                  - 'null'
                  default: null
                name:
                  type: string
                  maxLength: 255
                description:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                handlerHookEventLocationId:
                  type: integer
