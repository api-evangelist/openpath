      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount:
                    type: integer
                  filteredCount:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        orgId:
                          type: integer
                        acuId:
                          type: integer
                        maintenanceWindowDefinitionId:
                          type: integer
                        mesonTimeslots:
                          type:
