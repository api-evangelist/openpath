      - o{params.orgId}-hw:r
    delete:
      summary: Delete an organization's maintenance window
      operationId: deleteOrgMaintenanceWindowDefinition
      description: '__JWT is required for this endpoint with at least one of the following scopes__: o:w,s-o:w,o-basic:w,o{params.orgId}-hw:w


        __Endpoint name__: deleteOrgMaintenanceWindowDefinition'
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: integer
      - name: maintenanceWindowDefinitionId
        in: path
        required: true
        schema:
          type: integer
      tags:
      - orgs/maintenanceWindowDefinition
      security:
      - jwt: []
      responses:
        '204':
          description: No Content
      x-op-scopes:
      - o:w
      - s-o:w
      - o-basic:w
      - o{params.orgId}-hw:w
components:
  securitySchemes:
    jwt:
      type: apiKey
      name: Authorization
