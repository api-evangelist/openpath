              filteredCount:
                type: integer
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    orgId:
                      type: integer
                      x-nullable: true
                    day:
                      type: string
                      enum:
                      - Sunday
                      - Monday
                      - Tuesday
                      - Wednesday
                      - Thursday
                      - Friday
                      - Saturday
                    startTime:
                      type: string
                    durationHours:
                      type: integer
                    timeZone:
                      type: string
                  required:
                  - id
              meta:
                type: object
                properties:
                  accessToken:
