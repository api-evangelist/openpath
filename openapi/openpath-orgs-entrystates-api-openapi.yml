  /orgs/{orgId}/entryStates/{entryStateId}/triggerMethodIds:
    put:
      summary: Set a custom entry state's entire list of trigger methods
      operationId: setEntryStateTriggerMethodIds
      description: '__JWT is required for this endpoint with at least one of the following scopes__: o{params.orgId}-site:w,o{params.orgId}-entryState:w,o:w,s-o:w


        __Endpoint name__: setEntryStateTriggerMethodIds'
      parameters:
