      - o{params.orgId}-site:r
      - o{params.orgId}-entryState:w
      - o{params.orgId}-entryState:r
      - o:w
      - o:r
      - s-o:w
      - s-o:r
    delete:
      summary: Delete a custom entry state
      operationId: deleteEntryState
      description: '__JWT is required for this endpoint with at least one of the following scopes__: o{params.orgId}-site:w,o{params.orgId}-entryState:w,o:w,s-o:w


        __Endpoint name__: deleteEntryState'
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: integer
      - name: entryStateId
        in: path
        required: true
        schema:
          type: integer
      tags:
      - orgs/entryStates
      security:
      - jwt: []
      responses:
        '204':
          description: No Content
      x-op-scopes:
      - o{params.orgId}-site:w
      - o{params.orgId}-entryState:w
      - o:w
