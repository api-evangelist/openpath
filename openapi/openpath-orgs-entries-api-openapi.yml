        name: order
        in: query
      - type: string
        name: q
        in: query
      - type: string
        name: filter
        in: query
      - type: string
        name: preFilter
        in: query
      - type: string
        pattern: ^((withEffectiveLocationRestriction)(,|$))*$
        name: options
