swagger: '2.0'
info:
  title: Openpath API Documentation auth orgs/alarmConfigurations API
  version: 1.0.0
  description: Authentication and Login
host: api.openpath.com
schemes:
- https
consumes:
- application/json
produces:
- application/json
tags:
- name: orgs/alarmConfigurations
paths:
  /orgs/{orgId}/alarmConfigurations:
    get:
      summary: List all alarm configurations
      operationId: listAlarmConfigurations
      description: '__JWT is required for this endpoint with at least one of the following scopes__: o{params.orgId}-configurations:w,o{params.orgId}-configurations:r,o{params.orgId}-alarmConfigurations:w,o{params.orgId}-alarmConfigurations:r,o{params.orgId}-rpt:r,o{params.orgId}-rpt:w,s-o:w,s-o:r,o:w,o:r<br/><br/>__Endpoint name__: listAlarmConfigurations'
      parameters:
      - type: integer
        name: orgId
        in: path
        required: true
      - type: integer
        minimum: 1
        maximum: 1000
        name: limit
        in: query
      - type: integer
        default: 0
        minimum: 0
        name: offset
        in: query
      - type: string
        default: name
        pattern: ^[a-zA-Z0-9.]+(,\s*[a-zA-Z0-9.]+)*$
        name: sort
        in: query
      - type: string
        default: asc
        pattern: ^(asc|desc)+(,\s*(asc|desc)+)*$
        name: order
        in: query
      - type: string
        name: q
        in: query
      - type: string
        name: filter
        in: query
      - type: string
        name: preFilter
        in: query
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - orgs/alarmConfigurations
      security:
      - jwt: []
      responses:
        '200':
          schema:
            type: object
            properties:
              totalCount:
                type: integer
              filteredCount:
                type: integer
              cursors:
                type: object
                properties:
                  nextCursor:
                    type: integer
                    x-nullable: true
                    x-alternatives:
                    - type: integer
                      x-nullable: true
                    - type: string
                      pattern: ^[a-zA-Z0-9,@._~-]+$
                      x-nullable: true
                  hasNextPage:
                    type: boolean
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    description:
                      type: string
                    instructions:
                      type: string
                    isActive:
                      type: boolean
                    isMuted:
                      type: boolean
                    isNoteRequired:
                      type: boolean
                    alarmSeverity:
                      type: object
                      properties:
                        id:
                          type: number
                        name:
                          type: string
                      required:
                      - id
                    subscription:
                      type: object
                      properties:
                        id:
                          type: number
                        subjectOrg:
                          type: object
                          properties:
                            id:
                              type: integer
                          required:
                          - id
                        hookEvent:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            description:
                              type: string
                            updatedAt:
                              type: string
                              format: date
                          required:
                          - id
                        hookAction:
                          x-nullable: true
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            description:
                              type: string
                              x-nullable: true
                            config:
                              type: object
                            updatedAt:
                              type: string
                              format: date
                          required:
                          - id
                        targetUrl:
                          type: string
                          x-nullable: true
                        isActive:
                          type: boolean
                        isBlocking:
                          type: boolean
                        isVisible:
                          type: boolean
                        name:
