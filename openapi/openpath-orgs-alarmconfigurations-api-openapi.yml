openapi: 3.2.0
info:
  title: Openpath API Documentation Orgs/alarm Configurations API
  version: 1.0.0
servers:
- url: https://api.openpath.com
tags:
- name: orgs/alarmConfigurations
paths:
  /orgs/{orgId}/alarmConfigurations:
    get:
      summary: List all alarm configurations
      operationId: listAlarmConfigurations
      description: '__JWT is required for this endpoint with at least one of the following scopes__: o{params.orgId}-configurations:w,o{params.orgId}-configurations:r,o{params.orgId}-alarmConfigurations:w,o{params.orgId}-alarmConfigurations:r,o{params.orgId}-rpt:r,o{params.orgId}-rpt:w,s-o:w,s-o:r,o:w,o:r


        __Endpoint name__: listAlarmConfigurations'
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 1000
          minimum: 1
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: sort
        in: query
        schema:
          type: string
          default: name
          pattern: ^[a-zA-Z0-9.]+(,\s*[a-zA-Z0-9.]+)*$
      - name: order
        in: query
        schema:
          type: string
          default: asc
          pattern: ^(asc|desc)+(,\s*(asc|desc)+)*$
      - name: q
        in: query
        schema:
          type: string
      - name: filter
        in: query
        schema:
          type: string
      - name: preFilter
        in: query
        schema:
          type: string
      tags:
      - orgs/alarmConfigurations
      security:
      - jwt: []
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount:
                    type: integer
                  filteredCount:
                    type: integer
                  cursors:
                    type: object
                    properties:
                      nextCursor:
                        type:
                        - integer
                        - 'null'
                        x-alternatives:
                        - type:
                          - integer
                          - 'null'
                        - type:
                          - string
                          - 'null'
                          pattern: ^[a-zA-Z0-9,@._~-]+$
                      hasNextPage:
                        type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                        instructions:
                          type: string
                        isActive:
                          type: boolean
                        isMuted:
                          type: boolean
                        isNoteRequired:
                          type: boolean
                        alarmSeverity:
                          type: object
                          properties:
                            id:
                              type: number
                            name:
                              type: string
                          required:
                          - id
                        subscription:
                          type: object
                          properties:
                            id:
                              type: number
                            subjectOrg:
                              type: object
                              properties:
                                id:
                                  type: integer
                              required:
                              - id
                            hookEvent:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                description:
                                  type: string
                                updatedAt:
                                  type: string
                                  format: date
                              required:
                              - id
                            hookAction:
                              type:
                              - object
                              - 'null'
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                description:
                                  type:
                                  - string
                                  - 'null'
                                config:
                                  type: object
                                updatedAt:
                                  type: string
                                  format: date
                              required:
                              - id
                            targetUrl:
                              type:
                              - string
                              - 'null'
