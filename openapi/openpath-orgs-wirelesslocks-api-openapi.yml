      - type: integer
        name: orgId
        in: path
        required: true
      - type: array
        minItems: 1
        items:
          type: integer
        collectionFormat: multi
        name: wirelessLockIds
        in: query
        required: true
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - orgs/wirelessLocks
      security:
      - jwt: []
      responses:
        '201':
          description: Firmware updates started
      x-op-scopes:
