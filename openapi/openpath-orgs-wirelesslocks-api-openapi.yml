  /orgs/{orgId}/wirelessLocks/updateFirmwareBatch:
    post:
      summary: Update the firmware for multiple wireless locks to the latest version
      operationId: updateWirelessLockFirmwareBatch
      description: '__JWT is required for this endpoint with at least one of the following scopes__: o{params.orgId}-integrations:w,o{params.orgId}-site:w,o{params.orgId}-admin:w,o{params.orgId}-quickStart:w,o{params.orgId}-siteGeneral:w,o:w,s-o:w<br/><br/>__Endpoint name__: updateWirelessLockFirmwareBatch'
