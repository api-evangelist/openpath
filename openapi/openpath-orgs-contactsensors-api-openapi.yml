      security:
      - jwt: []
      responses:
        '200':
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id:
                    type: number
                  name:
                    type: string
                  isAjarEnabled:
                    type: boolean
                  ajarDurationSeconds:
                    type: number
                    x-nullable: true
                  isForcedOpenEnabled:
                    type: boolean
                  acuPort:
                    x-nullable: true
                    type: object
                    properties:
                      id:
                        type: number
                      acuPortTypePortNumber:
                        type: number
                      virtualPortNumber:
                        type: number
                        x-nullable: true
                      portNumber:
                        type: number
                        x-nullable: true
                      label:
                        type: string
                      acu:
                        type: object
                        properties:
                          id:
                            type: number
                          name:
                            type: string
                        required:
                        - id
                      expansionBoard:
                        type: object
                        properties:
                          id:
                            type: number
                          number:
