  /orgs/{orgId}/reports/auditLogs/ui:
    get:
      summary: Search/filter/return audit logs for UI
      operationId: getAuditLogsUi
      description: 'Returns audit log UI events for the `timestamp` specified date range. Default search time span is 1 hour ago to now.


        __JWT is required for this endpoint with at least one of the following scopes__: o{params.orgId}-dash:w,o{params.orgId}-dash:r,o{params.orgId}-rpt:w,o{params.orgId}-rpt:r,o{params.orgId}-portalAudit:w,o{params.orgId}-portalAudit:r,o:w,o:r,s-o:w,s-o:r


        __Endpoint name__: getAuditLogsUi'
