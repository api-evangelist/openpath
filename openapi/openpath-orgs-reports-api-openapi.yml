        in: header
        schema:
          type: string
          default: ''
          pattern: ^((log-all)(,|$))*$
      - name: orgId
        in: path
        required: true
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
          default: 10000
          maximum: 10000
          minimum: 1
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: sort
        in: query
        schema:
          type: string
          default: timestamp
          pattern: ^[a-zA-Z0-9.]+(,\s*[a-zA-Z0-9.]+)*$
      - name: order
        in: query
        schema:
          type: string
          default: desc
          pattern: ^(asc|desc)+(,\s*(asc|desc)+)*$
      - name: filter
        in: query
        schema:
          type: string
      - name: options
        in: query
        schema:
          type: string
          default: ''
          maxLength: 512
          pattern: ^((searchId:[a-zA-Z0-9_-]+)(,|$))*$
      tags:
