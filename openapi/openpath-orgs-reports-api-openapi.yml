        in: path
        required: true
        schema:
          type: integer
      - x-constraint:
          single: true
        name: siteIds
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            minimum: 1
      - x-constraint:
          single: true
        name: zoneIds
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            minimum: 1
      - name: referenceTime
        in: query
        schema:
          type: string
          format: date
      tags:
      - Orgs Reports
      security:
      - jwt: []
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount:
                    type: integer
                  filteredCount:
                    type: integer
                  cursors:
                    type: object
                    properties:
                      nextCursor:
                        type:
                        - integer
                        - 'null'
                        x-alternatives:
                        - type:
                          - integer
                          - 'null'
                        - type:
                          - string
                          - 'null'
                          pattern: ^[a-zA-Z0-9,@._~-]+$
                      hasNextPage:
                        type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        relativeTime:
                          type: string
                          enum:
                          - today
                          - thisWeek
                          - thisMonth
                          - thisQuarter
                          - thisYear
                          - yesterday
                          - lastFullWeek
                          - lastFullMonth
                          - lastFullQuarter
                          - last6FullMonths
                          - last12FullMonths
