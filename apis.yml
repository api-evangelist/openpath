aid: openpath
name: Openpath
description: >-
  Openpath is a cloud-based, mobile-first access control platform for the modern
  workplace — touchless entry, door/reader/relay hardware (ACUs), user and credential
  management, roles, schedules, sites and zones, video and alarm integrations. Founded
  in 2016 and backed by Emergence Capital, Openpath was acquired by Motorola Solutions
  in 2021 and is now marketed as Avigilon Alta; openpath.com redirects to
  avigilon.com/access-control. Its developer surface remains live: a documented REST
  API at api.openpath.com (546 operations, JWT scope-based auth, OpenID Connect) with
  reference docs on ReadMe.
